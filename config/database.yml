default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: "<%= ENV.fetch('DATABASE_HOST') { 'localhost' } %>"
  username: "<%= ENV.fetch('DATABASE_USERNAME') { 'postgres' } %>"
  password: "<%= ENV.fetch('DATABASE_PASSWORD') { '' } %>"
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>

development:
  <<: *default
  database: birthday_counter_development

test:
  <<: *default
  database: birthday_counter_test

production:
  <<: *default
  database: birthday_counter_production
