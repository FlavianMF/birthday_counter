<svg width="400" height="800" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="800" fill="#0F172A" />
  
  <!-- Header -->
  <text x="20" y="40" font-family="Montserrat, sans-serif" font-weight="bold" fill="white" font-size="18">Niver do Gabi 🎂</text>
  <circle cx="370" cy="35" r="15" fill="#1E293B" />
  <text x="370" y="39" font-family="Inter, sans-serif" fill="white" font-size="10" text-anchor="middle">JD</text>

  <!-- Countdown Banner -->
  <rect x="20" y="70" width="360" height="120" rx="20" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" />
  <text x="200" y="100" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.6)" font-size="12" text-anchor="middle">REVELAÇÃO EM</text>
  <text x="200" y="150" font-family="JetBrains Mono, monospace" font-weight="bold" fill="white" font-size="36" text-anchor="middle">08:14:32:12</text>

  <!-- Coins Badge -->
  <rect x="300" y="210" width="80" height="30" rx="15" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1" />
  <text x="340" y="230" font-family="Inter, sans-serif" font-weight="bold" fill="#F59E0B" font-size="14" text-anchor="middle">🪙 1,250</text>

  <!-- Grid of Cards -->
  <text x="20" y="230" font-family="Montserrat, sans-serif" font-weight="bold" fill="white" font-size="20">Próximos Jogos</text>

  <!-- Game Card 1 -->
  <rect x="20" y="260" width="170" height="200" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" />
  <text x="105" y="300" font-size="40" text-anchor="middle">🌍</text>
  <text x="105" y="340" font-family="Inter, sans-serif" font-weight="bold" fill="white" font-size="14" text-anchor="middle">Memory Geoguessr</text>
  <text x="105" y="365" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.5)" font-size="11" text-anchor="middle">Onde foi essa foto?</text>
  <rect x="55" y="410" width="100" height="30" rx="15" fill="#8B5CF6" />
  <text x="105" y="430" font-family="Inter, sans-serif" font-weight="bold" fill="white" font-size="12" text-anchor="middle">Jogar</text>

  <!-- Game Card 2 -->
  <rect x="210" y="260" width="170" height="200" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" />
  <text x="295" y="300" font-size="40" text-anchor="middle">🕵️</text>
  <text x="295" y="340" font-family="Inter, sans-serif" font-weight="bold" fill="white" font-size="14" text-anchor="middle">Fact or Fiction</text>
  <text x="295" y="365" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.5)" font-size="11" text-anchor="middle">Verdade ou Mentira?</text>
  <rect x="245" y="410" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" />
  <text x="295" y="430" font-family="Inter, sans-serif" font-weight="bold" fill="white" font-size="12" text-anchor="middle">Em Breve</text>

  <!-- Message Capsule -->
  <rect x="20" y="480" width="360" height="150" rx="20" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" />
  <text x="40" y="520" font-family="Montserrat, sans-serif" font-weight="bold" fill="white" font-size="16">Cápsula do Tempo 🔒</text>
  <text x="40" y="545" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.6)" font-size="12">Deixe uma mensagem para o futuro.</text>
  <rect x="40" y="570" width="320" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" />
  <text x="50" y="595" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.3)" font-size="14">Escreva algo incrível...</text>

  <!-- Bottom Nav -->
  <rect x="0" y="730" width="400" height="70" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="730" x2="400" y2="730" stroke="rgba(255,255,255,0.1)" />
  <g transform="translate(40, 745)">
    <text x="0" y="20" font-size="20">🏠</text>
    <text x="0" y="40" font-family="Inter, sans-serif" fill="#8B5CF6" font-size="10" text-anchor="middle">Home</text>
  </g>
  <g transform="translate(130, 745)">
    <text x="0" y="20" font-size="20">🎮</text>
    <text x="0" y="40" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle">Jogos</text>
  </g>
  <g transform="translate(220, 745)">
    <text x="0" y="20" font-size="20">🏆</text>
    <text x="0" y="40" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle">Ranking</text>
  </g>
  <g transform="translate(310, 745)">
    <text x="0" y="20" font-size="20">👤</text>
    <text x="0" y="40" font-family="Inter, sans-serif" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle">Perfil</text>
  </g>
</svg>
